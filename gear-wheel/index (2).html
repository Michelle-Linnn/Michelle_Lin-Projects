<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>齿轮工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: workshop bench — fixed tool rail on the left, full-bleed 3D stage on the right; stacks on phones */
:root{
  --bg:#e7ebee; --panel:#f5f7f8; --sunk:#eceff2; --ink:#17212a; --muted:#5b6874; --line:#c8d0d7;
  --accent:#a8640f; --accent-soft:#f3e3cc; --accent-ink:#ffffff; --warn:#b8352a; --warn-soft:#f7dcd8; --ok:#2d7a4c;
  --stage:#dde3e7; --grid-a:#b9c3cb; --grid-b:#cdd5db;
  --f-display:"Barlow Condensed","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111518; --panel:#181d22; --sunk:#13171b; --ink:#e2e7eb; --muted:#93a0ab; --line:#2b333b;
  --accent:#e2a64c; --accent-soft:#3a2c17; --accent-ink:#1b1306; --warn:#ff7d6e; --warn-soft:#3b1d1a; --ok:#6fcf97;
  --stage:#15191d; --grid-a:#2f3940; --grid-b:#212930; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111518; --panel:#181d22; --sunk:#13171b; --ink:#e2e7eb; --muted:#93a0ab; --line:#2b333b;
  --accent:#e2a64c; --accent-soft:#3a2c17; --accent-ink:#1b1306; --warn:#ff7d6e; --warn-soft:#3b1d1a; --ok:#6fcf97;
  --stage:#15191d; --grid-a:#2f3940; --grid-b:#212930; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage)}

.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none;color:var(--accent)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}

.block{display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2 b{color:var(--ink);font-weight:700;letter-spacing:.04em}

select,input[type=number]{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}
input[type=number]{width:74px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
input[type=checkbox]{accent-color:var(--accent)}

.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.list li{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line);cursor:pointer}
.list li:first-child{border-top:0}
.list li[aria-selected="true"]{background:var(--accent-soft)}
.list li:hover{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.lab{font-family:var(--f-display);font-weight:700;font-size:17px;width:22px}
.meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink);font-weight:500}
.rpm{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:0 6px;border-radius:999px;line-height:18px;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.drv{background:var(--accent);color:var(--accent-ink)}
.chip.rel{background:var(--sunk);border:1px solid var(--line);color:var(--muted)}

.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn.danger:hover{border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.grow{flex:1}

.field{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:10px}
.field>label:first-child{font-size:13px;color:var(--muted)}
.field .unit{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
.field .ctl{display:flex;align-items:center;gap:6px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:4px 6px;cursor:pointer;font-size:13px;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 20%,transparent)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}

.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.specs div{background:var(--sunk);padding:6px 8px;min-width:0}
.specs dt{font-size:11px;color:var(--muted);white-space:nowrap}
.specs dd{margin:0;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.warns{display:flex;flex-direction:column;gap:6px}
.warns p{margin:0;font-size:12.5px;padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.note{margin:0;font-size:12px;color:var(--muted)}
.status{font-size:12.5px;min-height:1.5em;margin:0}
.status.err{color:var(--warn)} .status.ok{color:var(--ok)}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent)}
.toolbar .grp{display:flex;align-items:center;gap:8px}
.toolbar .lbl{font-size:12px;color:var(--muted)}
.toolbar input[type=range]{width:120px}
.toolbar .val{font-family:var(--f-mono);font-size:12px;min-width:56px;font-variant-numeric:tabular-nums}
.tog{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
#viewport{position:relative;flex:1;min-height:0;touch-action:none}
#viewport canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:16px;bottom:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.hud .card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;backdrop-filter:blur(4px)}
.hud .big{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.hud .k{color:var(--muted);font-size:11px;letter-spacing:.08em}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}

@media (max-width:820px){
  .app{display:flex;flex-direction:column;height:auto}
  .stage{height:62vh;min-height:360px;order:-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
  .side{border-right:0;overflow:visible}
  .toolbar input[type=range]{width:90px}
  .hud{left:10px;right:10px;bottom:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <aside class="side">
    <header class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M17.6 2h4.8l.9 4.6a14 14 0 0 1 4 1.7l3.9-2.7 3.4 3.4-2.7 3.9a14 14 0 0 1 1.7 4l4.6.9v4.8l-4.6.9a14 14 0 0 1-1.7 4l2.7 3.9-3.4 3.4-3.9-2.7a14 14 0 0 1-4 1.7l-.9 4.6h-4.8l-.9-4.6a14 14 0 0 1-4-1.7l-3.9 2.7-3.4-3.4 2.7-3.9a14 14 0 0 1-1.7-4L2 22.4v-4.8l4.6-.9a14 14 0 0 1 1.7-4L5.6 8.8 9 5.4l3.9 2.7a14 14 0 0 1 4-1.7zM20 14a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
      <div><h1>齿轮工坊</h1><p>设计渐开线齿轮 · 搭建传动 · 导出可打印 STL</p></div>
    </header>

    <section class="block" aria-labelledby="h-asm">
      <div class="block-h"><h2 id="h-asm">装配</h2>
        <select id="preset" aria-label="载入示例装配">
          <option value="">载入示例…</option>
          <option value="pair">齿轮对 1:3</option>
          <option value="idler">惰轮链</option>
          <option value="twoStage">两级减速 9:1</option>
          <option value="clock">时针减速 12:1</option>
          <option value="helical">斜齿轮对</option>
          <option value="herring">人字齿轮对</option>
        </select>
      </div>
      <ul class="list" id="gearList" role="listbox" aria-label="齿轮列表"></ul>
      <div class="btns">
        <button class="btn grow" id="addMesh" title="在选中齿轮旁边加一个与它啮合的齿轮">+ 啮合齿轮</button>
        <button class="btn grow" id="addCoax" title="在选中齿轮上方叠一个同轴、一起转的齿轮">+ 同轴齿轮</button>
      </div>
    </section>

    <section class="block" id="editor" aria-labelledby="edTitle">
      <div class="block-h"><h2 id="edTitle">齿轮</h2><span id="edRel" class="chip rel"></span></div>
      <div class="field"><label for="f-z">齿数 z</label><div class="ctl"><input type="range" id="f-zr" min="6" max="120" step="1" aria-label="齿数滑块"></div><input type="number" id="f-z" min="6" max="200" step="1"></div>
      <div class="field"><label for="f-m">模数 m</label><div class="ctl"><select id="f-m">
        <option>0.5</option><option>0.8</option><option>1</option><option>1.25</option><option>1.5</option><option>2</option><option>2.5</option><option>3</option><option>4</option></select><span class="unit">mm</span></div><span></span></div>
      <div class="field"><label for="f-pa">压力角</label><div class="ctl"><select id="f-pa"><option value="14.5">14.5°</option><option value="20">20°</option><option value="25">25°</option></select></div><span></span></div>
      <div class="field"><label for="f-T">齿宽</label><div class="ctl"><input type="range" id="f-Tr" min="2" max="30" step="0.5" aria-label="齿宽滑块"></div><span><input type="number" id="f-T" min="1" max="60" step="0.5"><span class="unit">mm</span></span></div>
      <div class="field"><label for="f-bore">轴孔直径</label><div class="ctl"><label class="tog"><input type="checkbox" id="f-dflat">D 形</label></div><span><input type="number" id="f-bore" min="0" max="80" step="0.1"><span class="unit">mm</span></span></div>
      <div class="field"><label for="f-holes">减重孔</label><div class="ctl"><input type="range" id="f-holes" min="0" max="8" step="1"></div><span class="val" id="v-holes" style="font-family:var(--f-mono);font-size:12px"></span></div>
      <div class="field"><label>齿形</label><div class="seg" role="radiogroup" aria-label="齿形" style="grid-column:span 2">
        <label><input type="radio" name="f-type" value="spur">直齿</label>
        <label><input type="radio" name="f-type" value="helical">斜齿</label>
        <label><input type="radio" name="f-type" value="herring">人字齿</label></div></div>
      <div class="field" id="row-beta"><label for="f-beta">螺旋角 β</label><div class="ctl"><input type="range" id="f-beta" min="5" max="45" step="1"></div><span class="val" id="v-beta" style="font-family:var(--f-mono);font-size:12px"></span></div>
      <div class="field" id="row-phi"><label for="f-phi">啮合方位</label><div class="ctl"><input type="range" id="f-phi" min="-180" max="180" step="5"></div><span class="val" id="v-phi" style="font-family:var(--f-mono);font-size:12px"></span></div>
      <div class="field" id="row-phase"><label for="f-phase">相对转角</label><div class="ctl"><input type="range" id="f-phase" min="0" max="360" step="1"></div><span class="val" id="v-phase" style="font-family:var(--f-mono);font-size:12px"></span></div>
      <div class="field"><label>耗材颜色</label><div class="swatches" id="swatches" style="grid-column:span 2"></div></div>
      <dl class="specs" id="specs"></dl>
      <div class="warns" id="warns"></div>
      <div class="btns"><button class="btn danger" id="delBtn">删除</button></div>
    </section>

    <section class="block" aria-labelledby="h-print">
      <h2 id="h-print">打印公差</h2>
      <div class="field"><label for="g-bl">齿侧间隙</label><div class="ctl"><input type="range" id="g-blr" min="0" max="0.6" step="0.05" aria-label="齿侧间隙滑块"></div><span><input type="number" id="g-bl" min="0" max="1" step="0.05"><span class="unit">mm</span></span></div>
      <div class="field"><label for="g-pc">轴销间隙</label><div class="ctl"><input type="range" id="g-pcr" min="0" max="1" step="0.05" aria-label="轴销间隙滑块"></div><span><input type="number" id="g-pc" min="0" max="2" step="0.05"><span class="unit">mm</span></span></div>
      <p class="note">齿侧间隙从每个齿的分度圆齿厚中减去，FDM 常用 0.1–0.3 mm。轴销间隙是轴销比轴孔小的直径差，影响底板上轴销的松紧。</p>
    </section>

    <section class="block" aria-labelledby="h-exp">
      <h2 id="h-exp">导出 STL</h2>
      <label class="tog"><input type="checkbox" id="x-plate" checked>全套里附带底板和轴销</label>
      <div class="btns">
        <button class="btn primary grow" id="expAll">导出全套零件</button>
        <button class="btn grow" id="expSel">只导出选中零件</button>
      </div>
      <p class="status" id="expStatus"></p>
      <p class="note">文件下载为 .zip，每个零件一个二进制 STL，单位 mm，齿面朝 Z 轴平放，可直接拖进切片软件。同轴叠放的齿轮会合成一个零件一起打印。</p>
    </section>
  </aside>

  <main class="stage">
    <div class="toolbar">
      <div class="grp"><button class="btn primary" id="playBtn" aria-pressed="true">暂停</button>
        <button class="btn" id="dirBtn" title="切换主动轮旋转方向">逆时针 ↺</button></div>
      <div class="grp"><span class="lbl">主动轮转速</span><input type="range" id="rpm" min="1" max="60" step="1" aria-label="主动轮转速"><span class="val" id="v-rpm"></span></div>
      <div class="grp">
        <label class="tog"><input type="checkbox" id="t-pitch">分度圆</label>
        <label class="tog"><input type="checkbox" id="t-plate">底板预览</label>
      </div>
      <div class="grp"><button class="btn" id="viewTop">俯视</button><button class="btn" id="view3d">斜视</button></div>
    </div>
    <div id="viewport"></div>
    <div class="hud" id="hud"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const FIL = [
  {c:'#e8762b',n:'橙'},{c:'#2a9d8f',n:'青'},{c:'#e6e1d3',n:'原白'},{c:'#3b6db3',n:'蓝'},
  {c:'#d14848',n:'红'},{c:'#f0bf45',n:'黄'},{c:'#7a5c8f',n:'紫'},{c:'#5b8f3c',n:'绿'},{c:'#4a4f55',n:'石墨'}
];
let uid = 0;
function mkGear(o){
  uid++;
  return Object.assign({id:uid,parent:null,rel:'root',phi:0,z:20,m:2,pa:20,T:8,bore:5,dflat:false,holes:0,
    type:'spur',beta:20,hand:1,color:FIL[(uid-1)%FIL.length].c,phase:0}, o);
}
const S = { gears:[], sel:null,
  g:{backlash:0.15,pegClear:0.4,rpm:12,dir:1,playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,showPitch:false,showPlate:false,expPlate:true} };
const byId = id => S.gears.find(g => g.id === id);
const labelOf = g => { const i = S.gears.indexOf(g); let s='', n=i; do { s = String.fromCharCode(65 + n % 26) + s; n = Math.floor(n/26) - 1; } while(n >= 0); return s; };

/* ---------- presets ---------- */
const PRESETS = {
  pair(){ const a=mkGear({z:12,m:2,T:8}); const b=mkGear({z:36,parent:a.id,rel:'mesh',phi:0,holes:5}); return [a,b]; },
  idler(){ const a=mkGear({z:18}); const b=mkGear({z:12,parent:a.id,rel:'mesh',phi:20}); const c=mkGear({z:24,parent:b.id,rel:'mesh',phi:-25,holes:4}); return [a,b,c]; },
  twoStage(){ const a=mkGear({z:10,m:2,T:8}); const b=mkGear({z:30,parent:a.id,rel:'mesh',phi:0,holes:5});
    const b2=mkGear({z:10,parent:b.id,rel:'coax',T:8}); const c=mkGear({z:30,parent:b2.id,rel:'mesh',phi:90,holes:5}); return [a,b,b2,c]; },
  clock(){ const a=mkGear({z:10,m:1.5,T:6,bore:4}); const b=mkGear({z:30,parent:a.id,rel:'mesh',phi:0,holes:6});
    const b2=mkGear({z:10,m:1,parent:b.id,rel:'coax',T:6,bore:4}); const c=mkGear({z:40,m:1,parent:b2.id,rel:'mesh',phi:90,T:6,bore:4,holes:6}); return [a,b,b2,c]; },
  helical(){ const a=mkGear({z:15,type:'helical',beta:25,T:10}); const b=mkGear({z:27,parent:a.id,rel:'mesh',phi:0,type:'helical',beta:25,hand:-1,T:10,holes:4}); return [a,b]; },
  herring(){ const a=mkGear({z:16,type:'herring',beta:30,T:12}); const b=mkGear({z:28,parent:a.id,rel:'mesh',phi:0,type:'herring',beta:30,hand:-1,T:12,holes:5}); return [a,b]; }
};
function loadPreset(k){
  uid = 0; S.gears = PRESETS[k](); S.sel = S.gears[0].id; propagateAll();
  rebuildAll(); fitView(true);
}

/* ---------- topology ---------- */
function meshNeighbors(g){
  const out = S.gears.filter(c => c.parent === g.id && c.rel === 'mesh');
  if (g.rel === 'mesh') out.push(byId(g.parent));
  return out;
}
function propagateFrom(src){
  const seen = new Set([src.id]); const q = [src];
  while (q.length){ const g = q.shift();
    for (const n of meshNeighbors(g)) if (!seen.has(n.id)){ seen.add(n.id);
      n.m = g.m; n.pa = g.pa; n.type = g.type; n.beta = g.beta; n.hand = -g.hand; q.push(n); } }
}
function propagateAll(){ S.gears.filter(g => g.rel !== 'mesh').forEach(propagateFrom); }
function depth(g){ let d=0; while(g.parent){ g = byId(g.parent); d++; } return d; }
function coaxRoot(g){ while (g.rel === 'coax') g = byId(g.parent); return g; }
function compoundGroups(){
  const map = new Map();
  for (const g of S.gears){ const r = coaxRoot(g); if(!map.has(r.id)) map.set(r.id, []); map.get(r.id).push(g); }
  return [...map.values()];
}
function layout(){
  const L = new Map();
  for (const g of S.gears){
    if (g.rel === 'root'){ L.set(g.id, {x:0,y:0,zb:0}); continue; }

function stl(parts, name){

      for (const q of v){ dv.setFloat32(o, q[0], true); dv.setFloat32(o+4, q[1], true); dv.setFloat32(o+8, q[2], true); o += 12; }

}
function resize(){ const w = vp.clientWidth, h = vp.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
function toGeo(m){ const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(m.pos, 3)); geo.setIndex(m.idx); geo.computeVertexNormals(); return geo; }
function rebuildAll(){
  if (ok){
    const L = layout();
    for (const [id, v] of views) if (!byId(id)){ scene.remove(v.group); v.mesh.geometry.dispose(); views.delete(id); }
    for (const g of S.gears){
      let v = views.get(g.id);
      if (!v){ const group = new THREE.Group(), holder = new THREE.Group(); holder.rotation.x = -Math.PI/2; group.add(holder);
        const mat = new THREE.MeshStandardMaterial({roughness:0.58, metalness:0.04});
        const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat); mesh.userData.id = g.id; holder.add(mesh);
        v = {group, holder, mesh, key:'', pitch:null}; views.set(g.id, v); scene.add(group); }
      const key = gearKey(g, S.g.backlash);
      if (v.key !== key){ v.mesh.geometry.dispose(); v.mesh.geometry = toGeo(gearMesh(g)); v.key = key;
        if (v.pitch){ v.mesh.remove(v.pitch); v.pitch.geometry.dispose(); }
        const pts = circlePts(g.m*g.z/2, 96).map(p => new THREE.Vector3(p[0], p[1], g.T + 0.08));
        v.pitch = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0xffffff})); v.mesh.add(v.pitch); }
      v.pitch.visible = S.g.showPitch;
      v.mesh.material.color.set(g.color);
      const l = L.get(g.id); v.group.position.set(l.x, l.zb, -l.y);
    }
    raycastTargets = [...views.values()].map(v => v.mesh);
    buildPlatePreview(); highlight();
  }
  renderList(); renderEditor(); renderHud();
}
function buildPlatePreview(){
  while (plateGroup.children.length){ const c = plateGroup.children.pop(); c.geometry.dispose(); }
  plateGroup.visible = S.g.showPlate; grid.position.y = S.g.showPlate ? -4.05 : -0.05;
  if (!S.g.showPlate) return;
  const mat = new THREE.MeshStandardMaterial({color:new THREE.Color('#9aa3ab'), roughness:0.7});
  const holder = new THREE.Group(); holder.rotation.x = -Math.PI/2; holder.position.y = -4;
  for (const p of plateParts()){ const m = new THREE.Mesh(toGeo(p), mat); holder.add(m); }
  plateGroup.add(holder);
}
function highlight(){
  if (!ok) return; const {bad} = conflicts();
  for (const [id, v] of views){ const e = v.mesh.material.emissive;
    if (bad.has(id)) e.set('#7a1010'); else if (id === S.sel) e.set(css('--accent')).multiplyScalar(0.28); else e.set(0x000000); }
}
function fitView(top=false){
  if (!ok) return; const L = layout();
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity, zt = 0;
  for (const g of S.gears){ const l = L.get(g.id), ra = radii(g).ra; x0=Math.min(x0,l.x-ra); y0=Math.min(y0,l.y-ra); x1=Math.max(x1,l.x+ra); y1=Math.max(y1,l.y+ra); zt=Math.max(zt,l.zb+g.T); }
  const cx = (x0+x1)/2, cz = -(y0+y1)/2, R = Math.max(x1-x0, y1-y0, 30)/2;
  const dist = R / Math.tan(camera.fov*DEG/2) * (camera.aspect < 1 ? 1.9 : 1.35);
  controls.target.set(cx, zt/2, cz);
  if (top) camera.position.set(cx + 0.001, dist + zt, cz + 0.001);
  else camera.position.set(cx + dist*0.45, dist*0.75, cz + dist*0.75);
  camera.updateProjectionMatrix(); controls.update();
}
let th0 = 0, last = performance.now();
function frame(now){
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  if (S.g.playing) th0 += S.g.dir * S.g.rpm/60*TAU*dt;
  if (ok){ const A = angles(th0); for (const g of S.gears){ const v = views.get(g.id); if (v) v.mesh.rotation.z = A.get(g.id); }
    controls.update(); renderer.render(scene, camera); }
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
const relText = g => g.rel === 'root' ? '主动轮' : (g.rel === 'mesh' ? '啮合于 ' : '同轴于 ') + labelOf(byId(g.parent));
const rpmTxt = w => `${Math.abs(w) < 10 ? fmt(Math.abs(w), 2) : fmt(Math.abs(w), 1)} ${w >= 0 ? '↺' : '↻'}`;
function renderList(){
  const W = speeds(), {bad} = conflicts(), ul = $('#gearList'); ul.textContent = '';
  for (const g of S.gears){
    const li = document.createElement('li'); li.setAttribute('role','option'); li.setAttribute('aria-selected', g.id === S.sel); li.tabIndex = 0;
    li.style.paddingLeft = (10 + depth(g)*14) + 'px';
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = g.color;
    const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = labelOf(g);
    const meta = document.createElement('span'); meta.className = 'meta';
    meta.innerHTML = `<b>z${g.z}</b> · m${fmt(g.m)} · ${relText(g)}`;
    const r = document.createElement('span'); r.className = 'rpm';
    if (bad.has(g.id)){ const c = document.createElement('span'); c.className='chip warn'; c.textContent='干涉'; r.append(c, ' '); }
    else if (g.rel === 'root'){ const c = document.createElement('span'); c.className='chip drv'; c.textContent='主动'; r.append(c, ' '); }
    r.append(rpmTxt(W.get(g.id)) + ' rpm');
    li.append(sw, lab, meta, r);
    const pick = () => { S.sel = g.id; renderList(); renderEditor(); highlight(); renderHud(); };
    li.addEventListener('click', pick); li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(); } });
    ul.append(li);
  }
}
const SW = $('#swatches');
FIL.forEach(f => { const b = document.createElement('button'); b.style.background = f.c; b.title = f.n; b.setAttribute('aria-label', '颜色 ' + f.n); b.dataset.c = f.c;
  b.addEventListener('click', () => { const g = byId(S.sel); g.color = f.c; rebuildAll(); }); SW.append(b); });
function renderEditor(){
  const g = byId(S.sel); if (!g) return;
  $('#edTitle').innerHTML = `齿轮 <b>${labelOf(g)}</b>`; $('#edRel').textContent = relText(g);
  $('#f-z').value = g.z; $('#f-zr').value = Math.min(120, g.z); $('#f-m').value = String(g.m); $('#f-pa').value = String(g.pa);
  $('#f-T').value = g.T; $('#f-Tr').value = Math.min(30, g.T); $('#f-bore').value = g.bore; $('#f-dflat').checked = g.dflat;
  $('#f-holes').value = g.holes; $('#v-holes').textContent = g.holes < 2 ? '无' : g.holes + ' 个';
  document.querySelectorAll('input[name=f-type]').forEach(r => r.checked = r.value === g.type);
  $('#row-beta').hidden = g.type === 'spur'; $('#f-beta').value = g.beta; $('#v-beta').textContent = `${g.beta}° ${g.hand>0?'右旋':'左旋'}`;
  $('#row-phi').hidden = g.rel !== 'mesh'; $('#f-phi').value = g.phi; $('#v-phi').textContent = g.phi + '°';
  $('#row-phase').hidden = g.rel !== 'coax'; $('#f-phase').value = g.phase; $('#v-phase').textContent = g.phase + '°';
  SW.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === g.color));
  const {rp, rb, ra, rf} = radii(g), a = g.pa*DEG;
  const specs = [['分度圆 d', fmt(2*rp)], ['齿顶圆 da', fmt(2*ra)], ['齿根圆 df', fmt(2*rf)], ['基圆 db', fmt(2*rb)], ['齿距 p', fmt(Math.PI*g.m)]];
  const W = speeds(), wd = W.get(S.gears[0].id), wg = W.get(g.id);
  specs.push(['对主动轮', g.rel==='root' ? '1 : 1' : `${fmt(Math.abs(wd/wg))} : 1`]);
  const warns = [...gearMesh(g).warns];
  if (g.rel === 'mesh'){ const p = byId(g.parent), r1 = radii(p), cd = g.m*(p.z+g.z)/2;
    const eps = (Math.sqrt(r1.ra**2 - r1.rb**2) + Math.sqrt(ra**2 - rb**2) - cd*Math.sin(a)) / (Math.PI*g.m*Math.cos(a));
    specs.push(['中心距 a', fmt(cd)], ['重合度 ε', fmt(eps)], ['与 '+labelOf(p)+' 比', `${p.z} : ${g.z}`]);
    if (eps < 1.15) warns.push(`与 ${labelOf(p)} 的重合度只有 ${fmt(eps)}，传动会顿挫，建议增加齿数`); }
  const zmin = Math.ceil(2/Math.sin(a)**2 - 0.001);
  if (g.z < zmin) warns.push(`齿数少于 ${zmin}，${g.pa}° 压力角下齿根会根切，强度变弱；打印玩具传动一般仍可用`);
  const {msgs} = conflicts(); msgs.filter(m => m.includes(labelOf(g))).forEach(m => warns.push(m));
  $('#specs').innerHTML = specs.map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  $('#warns').innerHTML = ''; warns.forEach(w => { const p = document.createElement('p'); p.textContent = w; $('#warns').append(p); });
  const sub = countSub(g);
  const del = $('#delBtn'); del.disabled = g.rel === 'root';
  del.textContent = g.rel === 'root' ? '主动轮不能删除' : (armed === g.id ? `确认删除 ${labelOf(g)}${sub?` 及 ${sub} 个下游齿轮`:''}` : `删除 ${labelOf(g)}${sub?`（连同 ${sub} 个下游齿轮）`:''}`);
  $('#addMesh').textContent = `+ 与 ${labelOf(g)} 啮合`; $('#addCoax').textContent = `+ 叠在 ${labelOf(g)} 上`;
}
function countSub(g){ let n = 0; for (const c of S.gears) if (c.parent === g.id) n += 1 + countSub(c); return n; }
function renderHud(){
  const W = speeds(), d = S.gears[0], g = byId(S.sel) || d, {msgs} = conflicts();
  let slow = S.gears[0]; for (const x of S.gears) if (Math.abs(W.get(x.id)) < Math.abs(W.get(slow.id))) slow = x;
  const ratio = Math.abs(W.get(d.id)/W.get(slow.id));
  $('#hud').innerHTML = `
    <div class="card"><div class="k">主动 ${labelOf(d)}</div><div class="big">${fmt(S.g.rpm,1)} <small style="font-size:13px">rpm</small></div></div>
    <div class="card"><div class="k">选中 ${labelOf(g)}</div><div class="big">${rpmTxt(W.get(g.id))} <small style="font-size:13px">rpm</small></div></div>
    <div class="card"><div class="k">最慢 ${labelOf(slow)} · 总传动比</div><div class="big">${ratio >= 1 ? fmt(ratio) + ' : 1' : '1 : ' + fmt(1/ratio)}</div></div>
    ${msgs.length ? `<div class="card" style="color:var(--warn)"><div class="k" style="color:var(--warn)">干涉</div>${msgs.length} 处，见左侧红色标记</div>` : ''}`;
}
function freePhi(parent, z){
  const tryG = {...mkGearDummy(parent, z)};
  for (let k=0;k<24;k++){ const phi = [0,90,-90,45,-45,135,-135,180][k%8] + (k>=8 ? (k>=16?-20:20) : 0);
    S.gears.push({...tryG, phi}); const {bad} = conflicts(); S.gears.pop();
    if (!bad.has(-1)) return phi; }
  return 0;
}
function mkGearDummy(p, z){ return {id:-1,parent:p.id,rel:'mesh',phi:0,z,m:p.m,pa:p.pa,T:p.T,bore:p.bore,dflat:false,holes:0,type:p.type,beta:p.beta,hand:-p.hand,color:'#888',phase:0}; }
let armed = null;
function bind(){
  const upd = (fn, geo=true) => e => { const g = byId(S.sel); fn(g, e.target); armed = null; rebuildAll(); };
  const num = (el, lo, hi) => { const v = parseFloat(el.value); return isFinite(v) ? Math.max(lo, Math.min(hi, v)) : null; };
  $('#f-zr').addEventListener('input', upd((g,el) => g.z = +el.value));
  $('#f-z').addEventListener('change', upd((g,el) => { const v = num(el,6,200); if (v) g.z = Math.round(v); }));
  $('#f-m').addEventListener('change', upd((g,el) => { g.m = +el.value; propagateFrom(g); }));
  $('#f-pa').addEventListener('change', upd((g,el) => { g.pa = +el.value; propagateFrom(g); }));
  $('#f-Tr').addEventListener('input', upd((g,el) => g.T = +el.value));
  $('#f-T').addEventListener('change', upd((g,el) => { const v = num(el,1,60); if (v) g.T = v; }));
  $('#f-bore').addEventListener('change', upd((g,el) => { const v = num(el,0,80); if (v !== null) g.bore = v; }));
  $('#f-dflat').addEventListener('change', upd((g,el) => g.dflat = el.checked));
  $('#f-holes').addEventListener('input', upd((g,el) => g.holes = +el.value < 2 ? 0 : +el.value));
  document.querySelectorAll('input[name=f-type]').forEach(r => r.addEventListener('change', upd((g,el) => { g.type = el.value; propagateFrom(g); })));
  $('#f-beta').addEventListener('input', upd((g,el) => { g.beta = +el.value; propagateFrom(g); }));
  $('#f-phi').addEventListener('input', upd((g,el) => g.phi = +el.value));
  $('#f-phase').addEventListener('input', upd((g,el) => g.phase = +el.value));
  const pair = (r, n, key, lo, hi) => {
    const set = v => { S.g[key] = v; $(r).value = v; $(n).value = v; geoCache.clear(); rebuildAll(); };
    $(r).value = $(n).value = S.g[key];
    $(r).addEventListener('input', e => set(+e.target.value));
    $(n).addEventListener('change', e => { const v = num(e.target, lo, hi); if (v !== null) set(v); });
  };
  pair('#g-blr', '#g-bl', 'backlash', 0, 1); pair('#g-pcr', '#g-pc', 'pegClear', 0, 2);
  $('#addMesh').addEventListener('click', () => { const p = byId(S.sel), z = p.z >= 24 ? 14 : 24;
    const g = mkGear({parent:p.id, rel:'mesh', z, m:p.m, pa:p.pa, T:p.T, bore:p.bore, type:p.type, beta:p.beta, hand:-p.hand, phi: freePhi(p, z), holes: z >= 30 ? 4 : 0});
    S.gears.push(g); S.sel = g.id; armed = null; rebuildAll(); });
  $('#addCoax').addEventListener('click', () => { const p = byId(S.sel);
    const g = mkGear({parent:p.id, rel:'coax', z: p.z >= 20 ? 10 : 30, m:p.m, pa:p.pa, T:p.T, bore:p.bore, type:'spur'});
    S.gears.push(g); S.sel = g.id; armed = null; rebuildAll(); });
  $('#delBtn').addEventListener('click', () => { const g = byId(S.sel); if (!g || g.rel === 'root') return;
    if (armed !== g.id){ armed = g.id; renderEditor(); return; }
    const kill = new Set([g.id]); for (const c of S.gears) if (kill.has(c.parent)) kill.add(c.id);
    S.gears = S.gears.filter(x => !kill.has(x.id)); S.sel = g.parent; armed = null; rebuildAll(); });
  $('#preset').addEventListener('change', e => { if (e.target.value){ loadPreset(e.target.value); e.target.value = ''; } });
  const play = $('#playBtn');
  const syncPlay = () => { play.textContent = S.g.playing ? '暂停' : '播放'; play.setAttribute('aria-pressed', S.g.playing); play.classList.toggle('primary', S.g.playing); };
  play.addEventListener('click', () => { S.g.playing = !S.g.playing; syncPlay(); }); syncPlay();
  const dir = $('#dirBtn'); const syncDir = () => dir.textContent = S.g.dir > 0 ? '逆时针 ↺' : '顺时针 ↻';
  dir.addEventListener('click', () => { S.g.dir *= -1; syncDir(); renderList(); renderEditor(); renderHud(); }); syncDir();
  const rpm = $('#rpm'); rpm.value = S.g.rpm; $('#v-rpm').textContent = S.g.rpm + ' rpm';
  rpm.addEventListener('input', () => { S.g.rpm = +rpm.value; $('#v-rpm').textContent = S.g.rpm + ' rpm'; renderList(); renderEditor(); renderHud(); });
  $('#t-pitch').addEventListener('change', e => { S.g.showPitch = e.target.checked; rebuildAll(); });
  $('#t-plate').addEventListener('change', e => { S.g.showPlate = e.target.checked; if (ok) buildPlatePreview(); });
  $('#x-plate').addEventListener('change', e => S.g.expPlate = e.target.checked);
  $('#viewTop').addEventListener('click', () => fitView(true));
  $('#view3d').addEventListener('click', () => fitView(false));
  $('#expAll').addEventListener('click', () => doExport(true));
  $('#expSel').addEventListener('click', () => doExport(false));
}
bind();
if (ok) resize();
loadPreset('twoStage');
fitView(false);
syncExportUI();
requestAnimationFrame(frame);
})();
</script>
